<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="heritage.config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#26201a">
<title data-i18n="soutien.contribuer.signaler"></title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f0e4;--paper:#fffdf8;--ink:#2b2318;--stone:#8a7c66;--gold:#a8884f;--gold-soft:#c9ad79;--line:#e3d8c4;--green:#5c7a52;}
*{box-sizing:border-box;}
body{margin:0;font-family:'EB Garamond',Georgia,serif;color:var(--ink);background:var(--ivory);line-height:1.6;}
.topbar{position:sticky;top:0;z-index:10;background:rgba(38,32,26,0.96);color:var(--ivory);padding:11px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(0,0,0,.25);}
.topbar a.back{color:var(--gold-soft);text-decoration:none;font-size:13px;letter-spacing:1px;}
.topbar .t{flex:1;font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:3px;font-size:17px;}
main{max-width:680px;margin:0 auto;padding:24px 22px 60px;}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:6px 0 4px;}
.lead{font-style:italic;color:var(--stone);margin:0 0 22px;}
section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 18px;margin:14px 0;box-shadow:0 4px 14px rgba(43,35,24,.06);}
section h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:23px;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
section p{font-size:15.5px;margin:8px 0;color:#332a1d;}
.btn{display:inline-block;background:var(--gold);color:#2b2318;text-decoration:none;border:none;padding:12px 20px;border-radius:8px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
.btn.dark{background:#26201a;color:var(--ivory);}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
input[type=email]{flex:1;min-width:180px;padding:11px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:15px;}
.fineprint{font-size:12px;color:var(--stone);font-style:italic;margin-top:8px;}
.todo{font-size:11px;color:#9a5a2a;background:#fbf0e2;border:1px dashed #e0b88c;border-radius:5px;padding:2px 6px;}
</style>
  <script src="the-i18n.js"></script>
</head>
<body>
<div class="topbar"><a class="back" href="decouvrir.html" data-i18n="a.propos.menu"></a><span class="t" data-i18n="soutien.contribuer.signaler"></span></div>
<main>
  <h1 data-i18n="soutien.contribuer.signaler"></h1>

  <!-- Brique auto-portée « Contact / Signaler un bug » (rendu par brique-contact.js, masquée si pas de HConf.support) -->
  <section data-brique="contact"></section>

  <section>
    <h2 data-i18n="soutien.proposer.une.photo"></h2>
    <p data-i18n-html="soutien.rich.proposez.la.votre.apres"></p>
    <button class="btn ghost" id="photoBtn" type="button" data-i18n="soutien.proposer.une.photo"></button>
    <div class="fineprint" data-i18n="soutien.envoi.par.e.mail"></div>
  </section>

  <section>
    <h2 data-i18n-html="soutien.rich.rester.informe"></h2>
    <p data-i18n-html="soutien.rich.etre.prevenu.des.nouveaux"></p>
    <div class="row">
      <input type="email" id="nlEmail" data-i18n-placeholder="soutien.votre.e.mail" autocomplete="email">
      <button class="btn dark" id="nlBtn" type="button" data-i18n="soutien.s.inscrire"></button>
    </div>
    <div class="fineprint"><span data-i18n="soutien.consentement.explicite.conforme.rgpd"></span> <span class="todo" data-i18n="soutien.a.brancher.service.de"></span></div>
  </section>
</main>
<script>
  var CONTACT_EMAIL = (window.HConf&&HConf.support)||'';   // e-mail contact (HConf.support) — vide = masqué
  function uiT(k,v){ var s=(window.THEi18n&&THEi18n.ui(k)); if(s==null)s=k; return v?s.replace(/\{(\w+)\}/g,function(_,n){return v[n]!=null?v[n]:'{'+n+'}';}):s; }
  function safeMailto(subject, body){
    if(!CONTACT_EMAIL){ alert(uiT('premium.adresse.de.contact.a.configurer')); return; }
    var blurred=false, ob=function(){ blurred=true; };
    window.addEventListener('blur', ob);
    location.href='mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
    setTimeout(function(){ window.removeEventListener('blur', ob); if(!blurred){
      var msg=uiT('premium.aucune.appli.e.mail.detectee')+' '+CONTACT_EMAIL;
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(CONTACT_EMAIL).then(function(){ alert(msg+' '+uiT('premium.adresse.copiee')); }, function(){ alert(msg); }); }
      else alert(msg);
    } }, 1200);
  }
  // ---------- Proposer une photo (contribution) ----------
  var PHOTO_BODY=uiT('soutien.lieu.concerne.nom.exact.tel');
  var ph=document.getElementById('photoBtn');
  if(ph) ph.onclick=function(){ safeMailto(uiT('soutien.subject.photo'), PHOTO_BODY); };

  document.getElementById('nlBtn').onclick=function(){
    var em=document.getElementById('nlEmail').value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ alert(uiT('soutien.entrez.un.e.mail.valide')); return; }
    if(!CONTACT_EMAIL){ alert(uiT('soutien.inscription.enregistree.localement.service.newsletter')); return; }
    location.href='mailto:'+CONTACT_EMAIL+'?subject='+encodeURIComponent(uiT('soutien.subject.newsletter'))+'&body='+encodeURIComponent(uiT('soutien.inscrivez.moi')+em);
  };
</script>
<script src="brique-contact.js" defer></script>
<script src="the-footer.js" defer></script>
  <script src="analytics.js"></script>
</body>
</html>
