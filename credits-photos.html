<!doctype html>
<html lang="fr">
<head>
  <script src="heritage.config.js"></script>
  <script src="the-i18n.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4d3a">
<title data-i18n="credits.photos.titre"></title>
<style>
  :root{--vert:#1f4d3a;--sable:#f6f1e6;--encre:#2b2a26;--gris:#7d8893;--or:#c9a24a}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,serif;background:var(--sable);color:var(--encre)}
  header{position:sticky;top:0;z-index:5;background:var(--vert);color:var(--sable);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
  header a{color:var(--or);text-decoration:none;font-size:14px;white-space:nowrap}
  header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.5px}
  header .cnt{margin-left:auto;font-size:13px;color:#e9dcc0}
  main{max-width:1100px;margin:0 auto;padding:16px 14px 60px}
  .intro{color:#4a4a42;font-size:14.5px;line-height:1.6;background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
  figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07)}
  figure img{width:100%;height:120px;object-fit:cover;display:block;background:#e7ddc8}
  figcaption{padding:8px 10px}
  figcaption b{display:block;font-size:13px;line-height:1.25;margin-bottom:2px}
  figcaption span{font-size:11px;color:var(--gris);line-height:1.3;display:block}
  .empty{text-align:center;color:var(--gris);margin-top:40px;font-size:15px}
</style>
</head>
<body>
<header>
  <a href="index.html" data-i18n="credits.photos.carte"></a>
  <h1 data-i18n="credits.photos.credits.photos"></h1>
  <span class="cnt" id="count"></span>
</header>
<main>
  <p class="intro" data-i18n-html="credits.photos.rich.les.photographies.proviennent.de"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden data-i18n="credits.photos.aucune.photo.pour.le"></p>
</main>
<script>
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  Promise.all(['sites.geojson','sites-nature.geojson'].map(function(u){
    return fetch(u).then(function(r){return r.json();}).catch(function(){return {features:[]};});
  })).then(function(cols){
    var seen={}, items=[];
    cols.forEach(function(c){(c.features||[]).forEach(function(f){
      var p=f.properties||{};
      if(p.photo && !seen[p.photo]){ seen[p.photo]=1; items.push(p); }
    });});
    if(!items.length){ document.getElementById('empty').hidden=false; return; }
    items.sort(function(a,b){return (a.nom||'').localeCompare(b.nom||'','fr');});
    document.getElementById('count').textContent=items.length+' photos';
    // crédit : helper GÉNÉRIQUE de the-i18n.js (chaîne ou objet {auteur,licence,url})
    function credit(pc){ return THEcredit.html(pc) || 'Wikimedia Commons'; }
    document.getElementById('grid').innerHTML=items.map(function(p){
      return '<figure><img loading="lazy" src="'+esc(p.photo)+'" alt="" onerror="var f=this.closest(\'figure\');if(f)f.remove()">'
        +'<figcaption><b>'+esc(p.nom)+'</b><span>'+credit(p.photo_credit)+'</span></figcaption></figure>';
    }).join('');
  });
</script>
</body>
</html>
