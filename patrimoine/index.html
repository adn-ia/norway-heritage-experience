<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#26201a">
<title data-i18n="patrimoine.titre">Patrimoine</title>
<script src="config.js?v=ffd1f0c9"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ivory:#f6f0e4;--paper:#fffdf8;--ink:#2b2318;--stone:#8a7c66;--gold:#a8884f;--gold-soft:#c9ad79;--line:#e3d8c4;
      --peril:#a5432f;--moyen:#b9862f;--bon:#5c7a52;}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:'EB Garamond',Georgia,serif;color:var(--ink);background:var(--ivory);line-height:1.6;}
a{color:inherit;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(38,32,26,.97);color:var(--ivory);
  padding:11px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 14px rgba(0,0,0,.25);}
.topbar a.back{color:var(--gold-soft);text-decoration:none;font-size:13px;letter-spacing:1px;white-space:nowrap;}
.topbar .brand{flex:1;font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:3px;font-size:16px;text-transform:uppercase;}
.topbar .lang{display:flex;gap:6px;}
.topbar .lang button{background:none;border:1px solid rgba(201,173,121,.4);color:var(--gold-soft);
  font:inherit;font-size:12px;letter-spacing:1px;padding:3px 9px;border-radius:20px;cursor:pointer;text-transform:uppercase;}
.topbar .lang button.on{background:var(--gold-soft);color:#2b2318;border-color:var(--gold-soft);}
main{max-width:1240px;margin:0 auto;padding:26px clamp(16px,3.5vw,40px) 70px;}
.kicker{font-size:12.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin:0 0 6px;}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(30px,6vw,46px);line-height:1.04;margin:0 0 10px;}
.lead{font-style:italic;color:var(--stone);max-width:640px;font-size:17px;margin:0 0 22px;}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;margin:0 0 26px;padding:0 0 22px;border-bottom:1px solid var(--line);}
.stats .s{display:flex;align-items:baseline;gap:8px;}
.stats .s b{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:700;}
.stats .s.peril b{color:var(--peril);}
.stats .s span{font-size:14px;color:var(--stone);letter-spacing:.3px;}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 8px;}
.filters input[type=search],.filters select{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;}
.filters input[type=search]{flex:1;min-width:220px;}
.filters label.chk{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;color:var(--stone);cursor:pointer;
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;}
.count{font-size:13px;color:var(--stone);letter-spacing:.4px;margin:6px 2px 14px;}
.exportbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 20px;padding:11px 14px;background:#fbf6ec;border:1px solid var(--line);border-radius:10px;}
.exportbar .exlabel{font-size:13px;color:var(--stone);letter-spacing:.5px;margin-right:2px;}
.exportbar button{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--gold-soft);border-radius:8px;padding:7px 13px;cursor:pointer;transition:background .12s;}
.exportbar button:hover{background:var(--gold-soft);}
.exportbar button.off{opacity:.45;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:11px;
  padding:16px 16px 15px 20px;cursor:pointer;overflow:hidden;box-shadow:0 3px 12px rgba(43,35,24,.05);
  transition:transform .12s ease,box-shadow .12s ease;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(43,35,24,.10);}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stone);}
.card.peril::before{background:var(--peril);} .card.moyen::before{background:var(--moyen);} .card.bon::before{background:var(--bon);}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;margin:0 0 3px;line-height:1.12;}
.card .loc{font-size:13.5px;color:var(--stone);margin:0 0 11px;}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:11.5px;letter-spacing:.4px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--stone);background:#fbf6ec;}
.tag.etat{color:#fff;border:none;}
.tag.etat.peril{background:var(--peril);} .tag.etat.moyen{background:var(--moyen);} .tag.etat.bon{background:var(--bon);} .tag.etat.na{background:var(--stone);}
.tag.classe{border-color:var(--gold-soft);color:var(--gold);background:#fbf3e8;}
.empty{text-align:center;color:var(--stone);font-style:italic;padding:60px 0;}
/* modale */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(30,24,16,.55);}
.modal.on{display:flex;}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:26px 24px 30px;box-shadow:0 -10px 40px rgba(0,0,0,.3);}
@media(min-width:640px){.modal{align-items:center;} .sheet{border-radius:16px;}}
.sheet .close{float:right;background:none;border:none;font-size:22px;color:var(--stone);cursor:pointer;line-height:1;}
.sheet h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:28px;margin:0 8px 2px 0;line-height:1.08;}
.sheet .sub{color:var(--stone);font-size:14.5px;margin:0 0 18px;}
.rows{margin:0 0 18px;border-top:1px solid var(--line);}
.rows .r{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;}
.rows .r .k{color:var(--stone);}
.rows .r .v{text-align:right;font-weight:600;}
.sheet .maplink{display:inline-block;color:var(--gold);text-decoration:none;font-size:15px;margin:0 8px 16px 0;}
.sheet .signaler{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;font-size:15px;font-weight:600;
  padding:9px 16px;border-radius:8px;margin:0 0 16px;border:none;cursor:pointer;font-family:inherit;text-align:left;}
.sheet .fc{margin:0 0 16px;}
.sheet .fc-toggle{width:100%;}
.sheet .fc-form{display:flex;flex-direction:column;gap:9px;margin:12px 0 0;padding:14px;background:#fbf7ef;border:1px solid var(--line);border-radius:10px;}
.sheet .fc-form[hidden]{display:none;}
.sheet .fc-two{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.sheet .fc-i{width:100%;font-family:inherit;font-size:14.5px;color:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;box-sizing:border-box;}
.sheet .fc-i:focus{outline:2px solid var(--gold-soft);outline-offset:0;border-color:var(--gold);}
.sheet .fc-ta{resize:vertical;min-height:64px;}
.sheet .fc-rights{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#5a4d3a;line-height:1.35;cursor:pointer;}
.sheet .fc-rights input{margin-top:2px;flex:none;}
.sheet .fc-msg{font-size:13.5px;color:var(--stone);min-height:1px;}
.sheet .fc-send{align-self:flex-start;background:var(--gold);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;padding:9px 18px;border-radius:8px;}
.sheet .fc-send:disabled{opacity:.55;cursor:default;}
/* Aperçu de la fiche en haut du formulaire (confirmation) */
.sheet .fc-ctx{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:9px 12px;}
.sheet .fc-ctx-lead{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--stone);margin-bottom:2px;}
.sheet .fc-ctx-nom{display:block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:19px;line-height:1.15;color:#3a3226;}
.sheet .fc-ctx-meta{display:block;font-size:13px;color:var(--stone);margin-top:1px;}
.sheet .fc-lbl{font-size:12.5px;color:#5a4d3a;font-weight:600;margin:2px 0 -4px;}
.sheet .fc-file{width:100%;font-family:inherit;font-size:13px;color:#5a4d3a;padding:7px 0;box-sizing:border-box;}
.sheet .fc-file::file-selector-button{font-family:inherit;font-size:13.5px;color:#fff;background:var(--gold);border:none;border-radius:8px;padding:8px 14px;margin-right:10px;cursor:pointer;}
.sheet .fc-file::file-selector-button:hover{background:var(--gold-soft);}
.sheet .fc-upmsg{font-size:13px;color:var(--stone);min-height:1px;}
.sheet .fc-upmsg:empty{display:none;}
.sheet .fc-photoprev{margin:0;}
.sheet .fc-photoprev img{display:block;width:100%;max-height:200px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
/* Galerie photo de la fiche (toutes les photos dispo : Commons + contributions) */
.sheet .fiche-gallery{margin:0 0 16px;}
.sheet .fiche-gallery.empty{display:flex;align-items:center;justify-content:center;text-align:center;min-height:76px;padding:14px 18px;border:1px dashed var(--gold-soft);border-radius:12px;background:#fbf7ef;}
.sheet .fiche-gallery .fg-ph{font-size:13px;color:var(--stone);font-style:italic;max-width:36ch;line-height:1.4;}
.sheet .fiche-photo{margin:0;}
.sheet .fiche-photo img{display:block;width:100%;max-height:280px;object-fit:cover;border-radius:12px;}
.sheet .fiche-gallery.imgerr .fiche-photo img{display:none;}
.sheet .fiche-photo figcaption{font-size:12px;color:var(--stone);margin-top:5px;font-style:italic;}
.sheet .fiche-photo figcaption:empty{display:none;}
.sheet .fiche-thumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.sheet .fiche-thumbs .fg-t{width:52px;height:52px;border:1px solid var(--line);border-radius:7px;background-size:cover;background-position:center;background-color:#efe9de;cursor:pointer;padding:0;opacity:.72;transition:opacity .15s,border-color .15s;}
.sheet .fiche-thumbs .fg-t:hover{opacity:1;}
.sheet .fiche-thumbs .fg-t.on{opacity:1;border-color:var(--gold);border-width:2px;}
/* Enrichissements de la communauté (contributions validées attachées à la fiche) */
.sheet .fiche-enrich{margin:0 0 16px;}
.sheet .fiche-enrich:empty{display:none;}
.sheet .fe-h{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;margin:2px 0 8px;color:var(--ink);}
.sheet .fe-item{background:#fbf7ef;border:1px solid var(--line);border-left:3px solid var(--gold-soft);border-radius:8px;padding:10px 12px;margin:0 0 8px;}
.sheet .fe-obs{margin:0 0 6px;font-size:14.5px;line-height:1.45;color:#3a3226;}
.sheet .fe-photo{display:inline-block;font-size:12.5px;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:0 0 6px;}
.sheet .fe-meta{font-size:12px;color:var(--stone);font-style:italic;}
/* Corrections de fiche */
.sheet .corrige{display:inline-block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);background:#fbf3e8;border:1px solid var(--gold-soft);border-radius:20px;padding:1px 7px;margin-left:6px;vertical-align:middle;}
.sheet .fiche-note{background:#fbf7ef;border:1px solid var(--line);border-left:3px solid var(--gold-soft);border-radius:8px;padding:9px 12px;margin:0 0 16px;font-size:14px;line-height:1.45;color:#3a3226;}
.sheet .fiche-note .fn-k{font-weight:700;color:var(--ink);}
.sheet .fiche-edit{margin:0 0 16px;}
.sheet .fe-edit-toggle{width:100%;background:var(--paper);color:var(--gold);border:1px solid var(--gold-soft);border-radius:8px;padding:9px 14px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;text-align:left;}
.sheet .fe-edit-toggle:hover{background:#fbf3e8;}
.sheet .fe-edit-form{display:flex;flex-direction:column;gap:8px;margin:10px 0 0;padding:14px;background:#f4efe6;border:1px solid var(--line);border-radius:10px;}
.sheet .fe-edit-form[hidden]{display:none;}
/* Vignette photo sur les cartes de la liste */
.card.has-photo{display:flex;gap:12px;align-items:stretch;}
.card.has-photo .card-thumb{flex:none;width:78px;border-radius:8px;background-size:cover;background-position:center;background-color:#efe9de;}
.card.has-photo .card-main{flex:1;min-width:0;}
.sheet .soon{background:#fbf3e8;border-left:3px solid var(--gold-soft);padding:11px 14px;border-radius:6px;font-size:14px;color:#5a4d3a;margin:0 0 12px;}
.sheet .src{font-size:12px;color:var(--stone);}
.loading{text-align:center;color:var(--stone);font-style:italic;padding:70px 0;}
/* Feed contributions (F1) */
#feed{margin-top:40px;border-top:1px solid var(--line);padding-top:22px;}
.feed-h{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;margin:0 0 4px;}
.feed-sub{color:var(--stone);font-style:italic;font-size:14.5px;margin:0 0 16px;}
.fb-note{color:var(--stone);font-style:italic;text-align:center;padding:26px 0;}
.fb-card{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:15px 16px;margin:0 0 13px;box-shadow:0 3px 12px rgba(43,35,24,.05);}
.fb-top{display:flex;align-items:center;gap:10px;justify-content:space-between;}
.fb-top b{font-family:'Cormorant Garamond',serif;font-size:19px;}
.fb-badge{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.fb-badge.attente{background:#f5ead2;color:#8a6d1f;}
.fb-badge.valide{background:#e3efe4;color:#3f7a4a;}
.fb-badge.rejete{background:#f0e0da;color:#9a4a34;}
.fb-gov{font-size:13px;color:var(--stone);margin-top:2px;}
.fb-obs{font-size:15.5px;margin:9px 0;}
.fb-photo{display:inline-block;font-size:13.5px;color:var(--gold);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 10px;}
.fb-meta{font-size:12.5px;color:var(--stone);margin-top:9px;}
.fb-ctoggle{appearance:none;background:none;border:none;color:var(--gold);font:inherit;font-size:13.5px;cursor:pointer;padding:8px 0 0;text-decoration:underline;}
.fb-comments{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;}
.fb-c{margin:0 0 9px;}
.fb-cauthor{font-weight:700;font-size:14px;} .fb-crole{font-style:italic;font-weight:400;color:var(--gold);font-size:12px;}
.fb-cdate{font-size:11.5px;color:var(--stone);margin-left:8px;}
.fb-c p{margin:2px 0 0;font-size:14.5px;}
.fb-cempty{font-size:13px;color:var(--stone);font-style:italic;margin-bottom:8px;}
.fb-cform{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.fb-cform input,.fb-cform textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--ivory);}
.fb-cform .fb-cnom,.fb-cform .fb-cmail{flex:1;min-width:130px;}
.fb-cform .fb-ctext{flex-basis:100%;min-height:52px;resize:vertical;}
.fb-csend{appearance:none;background:var(--gold);color:#241c12;border:none;border-radius:7px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;}
.fb-cmsg{font-size:12.5px;color:var(--peril,#a5432f);align-self:center;}
/* Onglets Sites / Contributions */
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;}
.ptab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;font:inherit;font-size:15px;
  color:var(--stone);padding:9px 16px;cursor:pointer;margin-bottom:-1px;}
.ptab:hover{color:var(--ink);}
.ptab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600;}
.addsite{display:inline-flex;align-items:center;gap:9px;text-decoration:none;background:#fbf3e8;border:1px dashed var(--gold-soft);
  border-radius:10px;padding:12px 16px;color:#5a4d3a;font-size:15px;margin:0 0 16px;transition:background .15s;}
.addsite:hover{background:#f6ead4;}
.addsite-ic{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  background:var(--gold);color:#241c12;font-weight:700;font-size:16px;flex:none;}
/* Bouton connexion admin */
.authbtn{margin-left:auto;align-self:center;display:flex;align-items:center;gap:8px;}
.auth-who{font-size:12.5px;color:var(--stone);}
.auth-b{appearance:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;}
.auth-key{appearance:none;background:none;border:none;font-size:15px;cursor:pointer;opacity:.45;padding:4px;line-height:1;}
.auth-key:hover{opacity:1;}
.authbtn{position:relative;}
.auth-form{position:absolute;top:100%;right:0;margin-top:8px;display:flex;flex-direction:column;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:13px;box-shadow:0 14px 36px rgba(20,15,10,.2);z-index:60;width:215px;}
.auth-form[hidden]{display:none;}
.auth-form input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;background:#fff;box-sizing:border-box;}
.auth-form .auth-b{align-self:flex-end;}
.af-msg{font-size:11.5px;color:var(--stone);}
.auth-b:hover{background:var(--paper);}
/* Liste linéaire des contributions */
.fb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin:0 0 9px;cursor:pointer;font:inherit;}
.fb-row:hover{border-color:var(--gold-soft);box-shadow:0 2px 10px rgba(43,35,24,.06);}
.fb-row-main{display:flex;flex-direction:column;gap:2px;min-width:0;}
.fb-row-main b{font-family:'Cormorant Garamond',serif;font-size:18px;}
.fb-ref{font-size:12px;color:var(--stone);}
.fb-row-meta{display:flex;align-items:center;gap:10px;flex:none;}
.fb-row-date{font-size:12px;color:var(--stone);}
/* Carte */
#patMap{height:min(70vh,560px);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.map-note{font-size:12.5px;color:var(--stone);font-style:italic;margin:10px 0 0;}
.leaflet-popup-content{font-family:'EB Garamond',Georgia,serif;font-size:13.5px;}
.leaflet-popup-content a{color:var(--gold);}
/* Modale contribution (grande, pas plein écran) */
.cmodal{position:fixed;inset:0;z-index:1000;background:rgba(20,15,10,.55);display:flex;align-items:center;justify-content:center;padding:20px;}
.cmodal[hidden]{display:none;}
/* Pied du dashboard : lien vers la charte */
.pat-foot{margin:34px 0 0;padding-top:16px;border-top:1px solid var(--line);text-align:center;}
.pat-foot-link{background:none;border:none;cursor:pointer;font-family:inherit;font-size:13px;color:var(--stone);text-decoration:underline;text-underline-offset:3px;padding:4px;}
.pat-foot-link:hover{color:var(--gold);}
/* Charte : accès gratuit + règles */
.charte{position:fixed;inset:0;z-index:1200;background:rgba(30,24,16,.62);display:flex;align-items:center;justify-content:center;padding:20px;}
.charte[hidden]{display:none;}
.charte-box{background:var(--paper);border-radius:16px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 26px 74px rgba(20,15,10,.5);padding:26px 26px 20px;}
.charte-body h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:25px;line-height:1.12;margin:0 0 4px;color:var(--ink);}
.charte-body .charte-lead{color:var(--stone);font-size:14px;margin:0 0 16px;}
.charte-narr{margin:0 0 14px;}
.charte-narr p{margin:0 0 10px;font-size:14.5px;line-height:1.55;color:#3a3226;}
.charte-narr p:last-child{margin-bottom:0;}
.charte-narr b{color:#2b2318;font-weight:700;}
.charte-inp{background:#fbf3e8;border-left:3px solid var(--gold);border-radius:8px;padding:11px 13px;font-size:13px;line-height:1.5;color:#5a4d3a;margin:0 0 16px;}
.charte-inp b{color:#3a3226;}
.charte-more{display:inline-block;margin:2px 0 6px;color:var(--gold);text-decoration:none;font-size:14px;font-weight:600;}
.charte-more:hover{text-decoration:underline;}
.pat-foot-sep{color:var(--line);margin:0 8px;}
/* Walkthrough (visite guidée) */
.ptour{position:fixed;inset:0;z-index:1500;pointer-events:none;}
.ptour[hidden]{display:none;}
.ptour-hole{position:fixed;left:50%;top:50%;width:0;height:0;border-radius:10px;box-shadow:0 0 0 9999px rgba(30,24,16,.72);outline:3px solid var(--gold);outline-offset:2px;transition:left .25s,top .25s,width .25s,height .25s;pointer-events:none;animation:ptourPulse 1.7s ease-in-out infinite;}
@keyframes ptourPulse{0%,100%{outline-color:var(--gold);}50%{outline-color:var(--gold-soft);}}
@media(prefers-reduced-motion:reduce){.ptour-hole{animation:none;transition:none;}}
.ptour-tip{position:fixed;max-width:344px;width:calc(100vw - 32px);background:var(--paper);border-radius:14px;box-shadow:0 18px 52px rgba(20,15,10,.5);padding:18px 18px 14px;pointer-events:auto;box-sizing:border-box;}
.ptour.center .ptour-tip{left:50%;top:50%;transform:translate(-50%,-50%);}
.ptour-step{font-size:11.5px;letter-spacing:.06em;color:var(--gold);font-weight:700;margin-bottom:4px;}
.ptour-t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;margin:0 0 5px;line-height:1.1;}
.ptour-x{font-size:15px;line-height:1.5;color:#3a3226;margin:0 0 14px;}
.ptour-ctl{display:flex;align-items:center;gap:8px;}
.ptour-b{width:38px;height:38px;border:1px solid var(--line);background:var(--paper);color:var(--stone);border-radius:9px;cursor:pointer;font-size:17px;line-height:1;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;}
.ptour-b:hover{color:var(--gold);border-color:var(--gold-soft);}
.ptour-b:disabled{opacity:.4;cursor:default;}
.ptour-next{background:var(--gold);color:#fff;border-color:var(--gold);margin-left:auto;font-weight:700;}
.ptour-next:hover{background:var(--gold-soft);color:#fff;}
.charte-sec{margin:0 0 15px;}
.charte-sec h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:0 0 6px;font-weight:700;}
.charte-sec p{margin:0 0 7px;font-size:14px;line-height:1.5;color:#3a3226;padding-left:16px;position:relative;}
.charte-sec p::before{content:'';position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--gold-soft);}
.charte-sec.free{background:#fbf7ef;border-left:3px solid var(--gold);border-radius:8px;padding:12px 14px 6px;}
.charte-sec.free p{padding-left:16px;}
.charte-actions{margin-top:18px;text-align:right;}
.charte-ok{background:var(--gold);color:#fff;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;padding:11px 22px;border-radius:9px;}
.charte-ok:hover{background:#96774180;background:var(--gold-soft);}
.cmodal-box{background:var(--ivory);border-radius:14px;width:min(680px,100%);max-height:90vh;overflow:auto;position:relative;box-shadow:0 24px 70px rgba(20,15,10,.5);}
.cmodal-x{position:absolute;top:10px;right:12px;background:none;border:none;font-size:26px;line-height:1;color:var(--stone);cursor:pointer;z-index:2;}
.cmodal-body{padding:22px 22px 24px;}
.cm-head{display:flex;align-items:center;gap:12px;justify-content:space-between;padding-right:28px;}
.cm-head h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:25px;margin:0;}
.cm-ref,.cm-etat{font-size:13.5px;color:var(--stone);margin-top:3px;}
.cm-obs{font-size:16px;margin:12px 0;}
.cm-meta{font-size:12.5px;color:var(--stone);}
.cm-reason{background:#f0e0da;border-left:3px solid var(--peril,#a5432f);padding:9px 12px;border-radius:6px;font-size:13.5px;margin:10px 0;}
/* Scan anti-copie (modérateur) */
.cm-scan{margin:9px 0;padding:9px 12px;border-radius:7px;font-size:13.5px;background:#f4efe6;border:1px solid var(--line);color:var(--stone);}
.cm-scan.warn{background:#fbf3e8;border-color:var(--gold-soft);color:#5a4d3a;}
.cm-scan.ok{background:#eef2ea;border-color:#ccdcc4;color:#4b6041;}
.cm-scan-l{font-weight:600;}
.cm-scan-src{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.cm-scan-src a{font-size:12.5px;color:var(--gold);word-break:break-all;}
.cm-admin{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 4px;padding:12px;background:#f3ede0;border:1px solid var(--line);border-radius:10px;}
.cm-admin-lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep,#8a6d3a);font-weight:700;width:100%;}
.cm-btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);}
.cm-btn:hover{background:var(--paper);}
.cm-btn.ok{background:#e3efe4;border-color:#bcd6c1;color:#3f7a4a;}
.cm-btn.no{background:#f5ead2;border-color:#e6d3a2;color:#8a6d1f;}
.cm-btn.danger{background:#f0e0da;border-color:#e2bcae;color:#9a4a34;}
.cm-edit{display:flex;flex-direction:column;gap:5px;margin:10px 0;padding:12px;background:#fffdf8;border:1px dashed var(--gold-soft);border-radius:10px;}
.cm-edit label{font-size:12px;color:var(--stone);}
.cm-edit input,.cm-edit textarea{font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--ivory);}
.cm-edit textarea{min-height:70px;resize:vertical;}
.cm-edit-act{flex-direction:row;display:flex;gap:8px;margin-top:4px;}
.cm-comments{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}
.cm-comments h3{font-family:'Cormorant Garamond',serif;font-size:18px;margin:0 0 8px;}
.cm-clist{margin-bottom:10px;}
.cm-cform{display:flex;flex-wrap:wrap;gap:7px;}
.cm-cform input,.cm-cform textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);}
.cm-cnom,.cm-cmail{flex:1;min-width:130px;}
.cm-ctext{flex-basis:100%;min-height:52px;resize:vertical;}
.cm-csend{appearance:none;background:var(--gold);color:#241c12;border:none;border-radius:7px;padding:8px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;}
.cm-cmsg{font-size:12.5px;color:var(--peril,#a5432f);align-self:center;}
/* Panneau Partager (Mère) */
.share-panel{background:#f3ede0;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:0 0 16px;}
.share-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold-deep,#8a6d3a);margin-bottom:8px;}
/* Panneau modérateurs (Mère) */
.mod-panel{background:#f3ede0;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin:0 0 16px;}
.mod-panel[hidden]{display:none;}
.mod-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold-deep,#8a6d3a);margin-bottom:8px;}
.mod-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
.mod-row{display:flex;align-items:center;gap:8px;background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:7px 10px;}
.mod-who{flex:1;min-width:0;font-size:13.5px;line-height:1.3;}
.mod-who b{color:var(--ink);} .mod-who em{color:var(--stone);font-style:normal;font-size:12.5px;}
.mod-mail-l{display:block;color:var(--stone);font-size:11.5px;}
.mod-rm{flex:none;width:26px;height:26px;border:1px solid var(--line);background:#fff;color:#b3402e;border-radius:7px;cursor:pointer;font-size:13px;line-height:1;}
.mod-rm:hover{background:#fbecea;border-color:#e6b3ab;}
.mod-form{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.mod-form input{font-family:inherit;font-size:13.5px;color:var(--ink);background:#fffdf8;border:1px solid var(--line);border-radius:7px;padding:7px 10px;}
.mod-form .mod-name{flex:1;min-width:120px;} .mod-form .mod-mail{flex:1;min-width:150px;} .mod-form .mod-prof{flex:1;min-width:120px;}
.mod-add{font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;background:var(--gold);border:none;border-radius:7px;padding:8px 14px;cursor:pointer;}
.mod-add:hover{background:var(--gold-soft);}
.mod-msg{font-size:12.5px;color:var(--stone);}
.mod-note{font-size:11.5px;color:var(--stone);line-height:1.4;margin-top:8px;}
.share-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0;}
.share-lbl{font-size:13px;font-weight:600;min-width:64px;}
.share-row code{font-size:12.5px;background:#fffdf8;border:1px solid var(--line);border-radius:6px;padding:5px 9px;flex:1;min-width:180px;overflow:auto;white-space:nowrap;}
.share-b{appearance:none;background:var(--gold);color:#241c12;border:none;border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;flex:none;}
.share-note{font-size:12px;color:var(--stone);font-style:italic;margin-top:6px;}
/* Dashboard 2 colonnes */
.pat-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.pat-head .authbtn{margin-left:0;}
.pat-head-tools{display:flex;align-items:center;gap:10px;flex:none;}
/* Cloche de notifications */
.notif{position:relative;display:inline-flex;}
.notif[hidden]{display:none;}
.notif-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line);background:var(--paper);color:var(--stone);border-radius:10px;cursor:pointer;transition:color .15s,border-color .15s;}
.notif-btn:hover{color:var(--gold);border-color:var(--gold-soft);}
.notif-count{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;background:#b3402e;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;border-radius:9px;border:2px solid var(--paper);}
.notif-count[hidden]{display:none;}
.notif-panel{position:absolute;top:46px;right:0;width:340px;max-width:86vw;max-height:min(460px,70vh);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(43,35,24,.18);z-index:60;}
.notif-panel[hidden]{display:none;}
.notif-h{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:18px;padding:13px 16px 9px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);}
.notif-list{padding:5px 0;}
.notif-empty{padding:22px 16px;color:var(--stone);font-style:italic;font-size:14px;text-align:center;}
.notif-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);padding:11px 15px;cursor:pointer;font-family:inherit;color:inherit;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:#fbf7ef;}
.notif-item.is-new{background:#fcf6ea;}
.notif-item.is-new:hover{background:#f8efdd;}
.notif-dot{flex:none;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--gold);}
.notif-item:not(.is-new) .notif-txt{padding-left:17px;}
.notif-txt{flex:1;font-size:13.5px;line-height:1.35;color:#3a3226;}
.notif-snip{display:block;color:var(--stone);font-style:italic;margin-top:2px;font-size:12.5px;}
.notif-when{flex:none;font-size:11.5px;color:var(--stone);white-space:nowrap;margin-top:1px;}
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:14px;align-items:start;}
.dash-h{display:flex;align-items:center;justify-content:space-between;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:21px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.dash-map-btn{appearance:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;}
.dash-map-btn:hover{background:var(--paper);}
.dash-left .grid{grid-template-columns:1fr;max-height:68vh;overflow-y:auto;padding-right:4px;}
.dash-right{display:flex;flex-direction:column;gap:18px;}
.dash-zone{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:0 3px 12px rgba(43,35,24,.05);}
.dash-zone #feedList,.dash-zone #statutsList{max-height:40vh;overflow-y:auto;}
.dash-zh{display:flex;align-items:center;gap:9px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;margin:0 0 4px;}
.zone-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--gold);color:#241c12;font-family:'EB Garamond',serif;font-weight:700;font-size:12.5px;}
.zone-badge[hidden]{display:none;}
.mapbox{width:min(920px,100%);}
.mapbox #patMap{height:min(72vh,600px);border:none;border-radius:0;margin:0;}
@media (max-width:820px){ .dash{grid-template-columns:1fr;} .dash-left .grid{max-height:none;} }
/* Frise décorative (motifs config) */
.pat-frieze{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;opacity:.32;margin:2px 0 8px;}
/* Réponses aux commentaires */
.fb-reply{appearance:none;background:none;border:none;color:var(--gold);font:inherit;font-size:12px;cursor:pointer;padding:2px 0 0;text-decoration:underline;}
.fb-replyform{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px;}
.fb-replyform input,.fb-replyform textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper);}
.fb-replyform .r-nom,.fb-replyform .r-mail{flex:1;min-width:110px;}
.fb-replyform .r-text{flex-basis:100%;min-height:44px;resize:vertical;}
.r-msg{font-size:11px;color:var(--peril,#a5432f);align-self:center;}
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../decouvrir.html" data-i18n="patrimoine.retour">‹ Menu</a>
    <span class="brand" data-i18n="patrimoine.marque">Patrimoine</span>
    <span class="lang" id="langSw"></span>
  </div>

  <main>
    <div class="pat-head">
      <div>
        <p class="kicker" data-i18n="patrimoine.kicker">Veille citoyenne du patrimoine</p>
        <h1 data-i18n="patrimoine.h1">Le patrimoine, sous nos yeux</h1>
      </div>
      <div class="pat-head-tools">
        <span id="notifBell" class="notif" hidden>
          <button type="button" class="notif-btn" aria-haspopup="true" aria-expanded="false">
            <svg class="notif-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 22a2.1 2.1 0 0 0 2.1-2.1H9.9A2.1 2.1 0 0 0 12 22Zm6.3-6.2V10.5c0-3.2-1.7-5.9-4.7-6.6v-.7a1.6 1.6 0 0 0-3.2 0v.7c-3 .7-4.7 3.4-4.7 6.6v5.3L3.9 17.9v.9h16.2v-.9Z"/></svg>
            <span class="notif-count" hidden>0</span>
          </button>
          <div class="notif-panel" hidden>
            <div class="notif-h"></div>
            <div class="notif-list"></div>
          </div>
        </span>
        <span id="authBtn" class="authbtn"></span>
      </div>
    </div>
    <p class="lead" data-i18n="patrimoine.lead"></p>
    <div class="pat-frieze" id="frieze" aria-hidden="true"></div>
    <div class="stats" id="stats"></div>

    <div class="dash">
      <!-- Colonne GAUCHE : les sites (pleine hauteur, sélectionnables) -->
      <section class="dash-left">
        <div class="dash-h"><span data-i18n="patrimoine.tab.sites">Sites</span>
          <button class="dash-map-btn" type="button" id="openMap">🗺️ <span data-i18n="patrimoine.tab.carte">Carte</span></button></div>
        <a class="addsite" href="contribuer.html"><span class="addsite-ic">＋</span><span data-i18n="patrimoine.addsite">Un site manque à la liste ? Signalez-le</span></a>
        <div class="filters">
          <input type="search" id="q" data-i18n-ph="patrimoine.filtre.recherche">
          <select id="fGov"></select>
          <select id="fEtat"></select>
          <label class="chk"><input type="checkbox" id="fClasse"> <span data-i18n="patrimoine.filtre.classe"></span></label>
        </div>
        <div class="count" id="count"></div>
        <div class="exportbar">
          <span class="exlabel" data-i18n="patrimoine.export.titre">Exporter le dossier :</span>
          <button id="exPDF" data-i18n="patrimoine.export.pdf">Imprimer / PDF</button>
          <button id="exHTML" data-i18n="patrimoine.export.html">Télécharger (HTML)</button>
          <button id="exINP" data-i18n="patrimoine.export.inp">✉ Transmettre (e-mail)</button>
        </div>
        <div class="grid" id="list"></div>
        <div class="loading" id="loading">…</div>
        <div class="empty" id="empty" style="display:none" data-i18n="patrimoine.vide"></div>
      </section>

      <!-- Colonne DROITE : en cours (haut) + validées/rejetées (bas) -->
      <aside class="dash-right">
        <div class="dash-zone">
          <div id="sharePanel" class="share-panel" hidden></div>
          <div id="modPanel" class="mod-panel" hidden></div>
          <h2 class="dash-zh"><span data-i18n="patrimoine.feed.titre">Contributions de la communauté</span><span class="zone-badge" id="badgeCours" hidden></span></h2>
          <p class="feed-sub" data-i18n="patrimoine.feed.sous"></p>
          <div id="feedList"></div>
        </div>
        <div class="dash-zone">
          <h2 class="dash-zh"><span data-i18n="patrimoine.statuts.titre">Statuts des contributions</span></h2>
          <p class="feed-sub" data-i18n="patrimoine.statuts.sous"></p>
          <div id="statutsList"></div>
        </div>
      </aside>
    </div>

    <!-- Carte en modale (ouverte depuis le bouton Carte) -->
    <div id="mapModal" class="cmodal" hidden><div class="cmodal-box mapbox"><button class="cmodal-x" id="closeMap" aria-label="fermer">×</button><div id="patMap"></div><p class="map-note" data-i18n="patrimoine.carte.note"></p></div></div>

    <!-- Pied : rappel accès libre & règles (rouvre la charte) -->
    <footer class="pat-foot"><button type="button" class="pat-foot-link" id="charteLink"></button><span class="pat-foot-sep">·</span><a class="pat-foot-link" href="apropos.html" data-i18n="patrimoine.apropos.comment">À propos</a><span class="pat-foot-sep">·</span><button type="button" class="pat-foot-link" id="tourLink" data-i18n="patrimoine.tour.revoir">Revoir la visite</button></footer>
  </main>

  <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

  <!-- Charte : accès gratuit + participation & conduite (à l'ouverture, puis via le lien de pied) -->
  <div class="charte" id="charte" hidden><div class="charte-box" role="dialog" aria-modal="true" aria-labelledby="charteTitle"><div class="charte-body"></div><div class="charte-actions"><button class="charte-ok" id="charteOk" type="button"></button></div></div></div>

  <!-- Firebase (SDK compat) — UNIQUEMENT patrimoine. Inerte si config vide. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase.js?v=ffd1f0c9"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="i18n/engine.js?v=ffd1f0c9"></script>
  <script src="export.js?v=ffd1f0c9"></script>
  <script src="app.js?v=ffd1f0c9"></script>
  <script src="feed.js?v=ffd1f0c9"></script>
  <script src="tour.js?v=ffd1f0c9"></script>
  <script>
  /* Carte en modale (dashboard : plus d'onglets) */
  (function(){
    var m = document.getElementById('mapModal'), open = document.getElementById('openMap'), close = document.getElementById('closeMap');
    function show(){ if(!m) return; m.hidden = false; if(window.PatMap) PatMap.show(); }
    function hide(){ if(m) m.hidden = true; }
    if(open) open.addEventListener('click', show);
    if(close) close.addEventListener('click', hide);
    if(m) m.addEventListener('click', function(e){ if(e.target === m) hide(); });
  })();
  </script>
</body>
