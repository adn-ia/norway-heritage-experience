<!DOCTYPE html>
<html lang="fr">
<head>
  <script src="heritage.config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#26201a">
<title data-i18n="soutien.soutenir.le.projet"></title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f6f0e4;--paper:#fffdf8;--ink:#2b2318;--stone:#8a7c66;--gold:#a8884f;--gold-soft:#c9ad79;--line:#e3d8c4;--green:#5c7a52;}
*{box-sizing:border-box;}
body{margin:0;font-family:'EB Garamond',Georgia,serif;color:var(--ink);background:var(--ivory);line-height:1.6;}
.topbar{position:sticky;top:0;z-index:10;background:rgba(38,32,26,0.96);color:var(--ivory);padding:11px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 14px rgba(0,0,0,.25);}
.topbar a.back{color:var(--gold-soft);text-decoration:none;font-size:13px;letter-spacing:1px;}
.topbar .t{flex:1;font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:3px;font-size:17px;}
main{max-width:680px;margin:0 auto;padding:24px 22px 60px;}
h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:6px 0 4px;}
.lead{font-style:italic;color:var(--stone);margin:0 0 22px;}
section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 18px;margin:14px 0;box-shadow:0 4px 14px rgba(43,35,24,.06);}
section h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:23px;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
section p{font-size:15.5px;margin:8px 0;color:#332a1d;}
.btn{display:inline-block;background:var(--gold);color:#2b2318;text-decoration:none;border:none;padding:12px 20px;border-radius:8px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;}
.fineprint{font-size:12px;color:var(--stone);font-style:italic;margin-top:8px;}
.todo{font-size:11px;color:#9a5a2a;background:#fbf0e2;border:1px dashed #e0b88c;border-radius:5px;padding:2px 6px;}
.rate-stars{display:flex;gap:6px;font-size:36px;line-height:1;color:var(--gold);cursor:pointer;user-select:none;margin:6px 0 2px;}
.rate-stars span{transition:transform .1s;outline:none;}
.rate-stars span:hover,.rate-stars span:focus{transform:scale(1.18);}
.rate-label{font-size:14px;color:var(--stone);font-style:italic;margin:2px 0 10px;min-height:18px;}
#rateComment{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;font-size:15px;resize:vertical;margin-bottom:8px;background:#fffdf8;}
</style>
  <script src="the-i18n.js"></script>
</head>
<body>
<div class="topbar"><a class="back" href="decouvrir.html" data-i18n="a.propos.menu"></a><span class="t" data-i18n="soutien.soutenir.le.projet"></span></div>
<main>
  <h1 data-i18n="soutien.soutenir.le.projet"></h1>

  <!-- Aide & contact — TOUJOURS visible (jamais .ios-hide, aucune dépendance à HConf) :
       garantit que la page soutien n'est jamais vide sur iOS (Apple 2.1(a)).
       La brique contact ci-dessous ajoute le bouton e-mail quand HConf.support est renseigné. -->
  <section>
    <h2 data-i18n="soutien.aide.titre"></h2>
    <p data-i18n="soutien.aide.texte"></p>
    <section data-brique="contact"></section>
  </section>

  <!-- Café : juste un lien Lemon Squeezy, rien de plus (masqué sur apps de store — App Store 3.1.1) -->
  <section class="ios-hide">
    <p data-i18n-html="soutien.rich.pays.heritage.est.un"></p>
    <a class="btn" id="tipBtn" href="#" target="_blank" rel="noopener"><span data-i18n="soutien.laisser.un.pourboire"></span> <span style="font-weight:400;font-size:13px" data-i18n="soutien.a.partir.de.0"></span></a>
    <div class="fineprint"><span data-i18n="soutien.paiement.securise.via.lemonsqueezy"></span></div>
  </section>

  <!-- Brique auto-portée « Notez l'application » (⭐ vous aimez l'appli — masquée si pas de store) -->
  <section data-brique="note-app"></section>
</main>
<script>
  var LEMON_URL = (window.HConf&&HConf.tip)||'';
  function uiT(k){ var s=(window.THEi18n&&THEi18n.ui(k)); return s==null?k:s; }
  var tip=document.getElementById('tipBtn');
  if(LEMON_URL) tip.href=LEMON_URL; else tip.onclick=function(e){ e.preventDefault(); alert(uiT('soutien.lien.de.pourboire.a.configurer')); };
</script>
<script src="brique-note.js" defer></script>
<script src="brique-contact.js" defer></script>
<script src="the-footer.js" defer></script>
  <script src="analytics.js"></script>
  <script>/* App Store 3.1.1 : masquer tout paiement externe (pourboire/don) quand on tourne sur iOS/Android store */
  (function(){var u=navigator.userAgent||'';
   var iOS=/iPad|iPhone|iPod/.test(u)||((/Mac/.test(u)||navigator.platform==='MacIntel'||navigator.platform==='iPad')&&(navigator.maxTouchPoints>1||'ontouchend' in document));
   var andr=/Android/.test(u)&&((new URLSearchParams(location.search)).get('app')==='play'||(document.referrer||'').indexOf('android-app://')===0||(function(){try{return sessionStorage.getItem('the_store_app')==='1';}catch(e){return false;}})());
   if(andr){try{sessionStorage.setItem('the_store_app','1');}catch(e){}}
   if(iOS||andr){var e=document.querySelectorAll('.ios-hide');for(var k=0;k<e.length;k++)e[k].style.display='none';}})();</script>
</body>
</html>
